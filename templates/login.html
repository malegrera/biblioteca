{% extends 'base.html' %}

{% block title %}Iniciar sesión | Biblioteca{% endblock %}

{% block content %}
    <section class="py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <h1 class="h2 text-primary mb-4">
                    Iniciar sesión
                </h1>

                <form method="post">
                    {% csrf_token %}

                    {% if form.errors %}
                        <div class="alert alert-danger" role="alert">
                            Usuario o contraseña incorrectos.
                        </div>
                    {% endif %}

                    <div class="mb-3">
                        <label for="id_username" class="form-label">
                            Usuario
                        </label>
                        <input type="text"
                               name="username"
                               id="id_username"
                               class="form-control"
                               autocomplete="username"
                               required>
                    </div>

                    <div class="mb-3">
                        <label for="id_password" class="form-label">
                            Contraseña
                        </label>
                        <input type="password"
                               name="password"
                               id="id_password"
                               class="form-control"
                               autocomplete="current-password"
                               required>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Iniciar sesión
                    </button>
                </form>
            </div>
        </div>
    </section>
{% endblock %}
